name: 機能仕様（AI駆動開発用）
description: /issue-dev パイプラインで実装する機能仕様を登録する
title: "[Feature] "
labels: ["spec"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的・背景
      description: なぜこの機能が必要か。ユーザー視点での価値。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了と判断できる検証可能な条件を箇条書きで。AIエージェントはこれを実装・テストのゴールにする。
      placeholder: |
        - [ ] 教材一覧画面で category ごとの絞り込みができる
        - [ ] API `/api/materials?category=x` が Zod でバリデーションされる
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影響範囲（想定）
      multiple: true
      options:
        - apps/web（Next.js 画面）
        - apps/api（Hono API）
        - packages/shared（スキーマ・型）
        - content/（教材・問題）
        - docs/adr・docs/design.md（ADR の追加・置き換えが必要）
    validations:
      required: true
  - type: input
    id: adr-ref
    attributes:
      label: 関連 ADR / 新規 ADR の要否
      description: 関連する ADR（例「ADR-0005」）。層と依存方向・データフローに関わる場合は docs/design.md の節（例「§5.3」）。契約を新設・変更するなら「新規 ADR が必要」、UI の文言や表示の細部だけなら「不要」と記載。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足・制約
      description: 技術的制約、参考リンク、やらないこと（スコープ外）など。
    validations:
      required: false
