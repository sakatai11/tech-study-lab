name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration immutability tests
        run: pnpm migration:test

      - name: Migration immutability check (pull requests)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm run migration:check-immutable "$PR_BASE_SHA" HEAD

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome + dependency boundaries)
        run: pnpm lint

      - name: Agent contract check (hooks, sync, contract docs)
        run: |
          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required by scripts/test-hooks.sh but was not found on the runner"
            exit 1
          }
          pnpm test:hooks

      - name: Test
        run: pnpm test

      - name: Architecture check (develop PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
        run: pnpm architecture:check

      - name: Architecture test (develop PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
        run: pnpm architecture:test

      - name: Build
        run: pnpm build
